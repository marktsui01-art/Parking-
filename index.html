        /**
         * A 2D Vector class for geometric operations.
         */
        class Vector2 {
            /**
             * @param {number} x
             * @param {number} y
             */
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            /**
             * Adds another vector to this one.
             * @param {Vector2} v
             * @returns {Vector2} New vector
             */
            add(v) {
                return new Vector2(this.x + v.x, this.y + v.y);
            }

            /**
             * Subtracts another vector from this one.
             * @param {Vector2} v
             * @returns {Vector2} New vector
             */
            sub(v) {
                return new Vector2(this.x - v.x, this.y - v.y);
            }

            /**
             * Scales the vector by a scalar.
             * @param {number} s
             * @returns {Vector2} New vector
             */
            scale(s) {
                return new Vector2(this.x * s, this.y * s);
            }

            /**
             * Calculates the dot product with another vector.
             * @param {Vector2} v
             * @returns {number}
             */
            dot(v) {
                return this.x * v.x + this.y * v.y;
            }

            /**
             * Rotates the vector by an angle.
             * @param {number} angle Angle in radians
             * @returns {Vector2} New vector
             */
            rotate(angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return new Vector2(
                    this.x * cos - this.y * sin,
                    this.x * sin + this.y * cos
                );
            }

            /**
             * Returns the magnitude of the vector.
             * @returns {number}
             */
            magnitude() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }

            /**
             * Returns a normalized vector.
             * @returns {Vector2}
             */
            normalize() {
                const m = this.magnitude();
                return m === 0 ? new Vector2(0, 0) : this.scale(1 / m);
            }
        }

        /**
         * Helper to create polygon vertices for a rectangle.
         * @param {number} x Center x
         * @param {number} y Center y
         * @param {number} width Width (x-axis local)
         * @param {number} height Height (y-axis local)
         * @param {number} angle Angle in radians
         * @returns {Vector2[]}
         */
        function createPolygon(x, y, width, height, angle) {
            const hw = width / 2;
            const hh = height / 2;
            // Corners relative to center, unrotated
            const corners = [
                new Vector2(hw, hh),
                new Vector2(hw, -hh),
                new Vector2(-hw, -hh),
                new Vector2(-hw, hh)
            ];
            // Rotate and translate
            return corners.map(p => p.rotate(angle).add(new Vector2(x, y)));
        }

        /**
         * Handles keyboard and gamepad input.
         */
        class InputHandler {
            constructor() {
                this.keys = {};

                // Ensure we are in a browser environment before adding listeners
                if (typeof window !== 'undefined') {
                    window.addEventListener('keydown', (e) => this.keys[e.code] = true);
                    window.addEventListener('keyup', (e) => this.keys[e.code] = false);
                }
            }

            /**
             * Gets the current steering input (-1 to 1).
             * @returns {number}
             */
            getSteer() {
                let steer = 0;
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) steer -= 1;
                if (this.keys['KeyD'] || this.keys['ArrowRight']) steer += 1;

                // Gamepad check
                if (typeof navigator !== 'undefined' && navigator.getGamepads) {
                    const gamepad = navigator.getGamepads()[0];
                    if (gamepad) {
                        // Left stick horizontal axis (usually axis 0)
                        const axisX = gamepad.axes[0];
                        if (Math.abs(axisX) > 0.1) steer = axisX; // Deadzone
                    }
                }

                return Math.max(-1, Math.min(1, steer));
            }

            /**
             * Gets the current throttle/brake input (-1 to 1).
             * Positive is forward, negative is backward/brake.
             * @returns {number}
             */
            getThrottle() {
                let throttle = 0;
                if (this.keys['KeyW'] || this.keys['ArrowUp']) throttle += 1;
                if (this.keys['KeyS'] || this.keys['ArrowDown']) throttle -= 1;

                // Gamepad check
                if (typeof navigator !== 'undefined' && navigator.getGamepads) {
                    const gamepad = navigator.getGamepads()[0];
                    if (gamepad) {
                        // Triggers usually are buttons 6 (LT) and 7 (RT)
                        // They return a value between 0 and 1.
                        const brake = gamepad.buttons[6] ? gamepad.buttons[6].value : 0;
                        const gas = gamepad.buttons[7] ? gamepad.buttons[7].value : 0;

                        throttle += gas;
                        throttle -= brake;
                    }
                }

                return Math.max(-1, Math.min(1, throttle));
            }
        }

        /**
         * Headless Game Engine containing physics and logic.
         */
        class GameEngine {
            constructor(config = {}) {
                // Car State
                // this.pos represents the REAR AXLE position
                this.pos = new Vector2(100, 300);
                this.heading = 0; // Radians, 0 points East
                this.velocity = 0;
                this.steerAngle = 0;

                // Constants / Configuration
                // Scale: ~20 pixels = 1 meter
                this.wheelBase = config.wheelBase || 56; // ~2.8m
                this.maxSteerAngle = config.maxSteerAngle || (40 * Math.PI / 180); // 40 degrees
                this.maxSpeed = config.maxSpeed || 300; // 15 m/s = 54 km/h
                this.acceleration = config.acceleration || 150;
                this.friction = config.friction || 0.95;

                // Dimensions for collision
                this.width = config.width || 38; // ~1.9m
                const totalLength = config.length || 94; // ~4.7m

                // Refactored for independent overhangs (default to symmetrical)
                this.frontOverhang = config.frontOverhang !== undefined ? config.frontOverhang : (totalLength - this.wheelBase) / 2;
                this.rearOverhang = config.rearOverhang !== undefined ? config.rearOverhang : (totalLength - this.wheelBase) / 2;
                this.length = this.frontOverhang + this.wheelBase + this.rearOverhang;

                // Level Data
                this.currentLevel = null;
                this.crashTimer = 0; // Timer for visual feedback
                this.won = false;
                this.score = 1000;
            }

            loadLevel(level) {
                this.currentLevel = level;
                this.pos = new Vector2(level.start.x, level.start.y);
                this.heading = level.start.heading || 0;
                this.velocity = 0;
                this.steerAngle = 0;
                this.crashTimer = 0;
                this.won = false;
                this.score = 1000;
            }

            /**
             * Updates the game state.
             * @param {number} dt Delta time in seconds
             * @param {object} input Input state { steer: number, throttle: number }
             */
            update(dt, input) {
                if (this.won) return;

                // Store previous state for collision resolution
                const prevPos = new Vector2(this.pos.x, this.pos.y);
                const prevHeading = this.heading;

                // 1. Update Steering Angle
                this.steerAngle = input.steer * this.maxSteerAngle;

                // 2. Update Velocity (Acceleration & Friction)
                if (input.throttle !== 0) {
                    this.velocity += input.throttle * this.acceleration * dt;
                } else {
                    this.velocity *= Math.pow(this.friction, dt * 60);
                    if (Math.abs(this.velocity) < 0.1) this.velocity = 0;
                }

                // Clamp speed
                this.velocity = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.velocity));

                // 3. Movement
                this.pos.x += this.velocity * Math.cos(this.heading) * dt;
                this.pos.y += this.velocity * Math.sin(this.heading) * dt;

                const angularVelocity = (this.velocity / this.wheelBase) * Math.tan(this.steerAngle);
                this.heading += angularVelocity * dt;

                // 4. Collision Detection & Resolution
                if (this.crashTimer > 0) this.crashTimer -= dt;

                if (this.currentLevel) {
                    let colliding = false;
                    const carPoly = this.getPolygon();

                    for (const obs of this.currentLevel.obstacles) {
                        const obsPoly = createPolygon(obs.x, obs.y, obs.width, obs.height, obs.angle);
                        if (SAT.checkCollision(carPoly, obsPoly)) {
                            colliding = true;
                            break;
                        }
                    }

                    if (colliding) {
                        // Resolve: Revert and stop
                        this.pos = prevPos;
                        this.heading = prevHeading;

                        // Penalty only if we were actually moving
                        if (Math.abs(this.velocity) > 1) {
                            this.score = Math.max(0, this.score - 50);
                            this.crashTimer = 0.5; // Flash for 500ms
                        }
                        this.velocity = 0;
                    }

                    // Win Condition
                    const isStationary = Math.abs(this.velocity) < 1;
                    const isInputNeutral = input.steer === 0 && input.throttle === 0;

                    if (isStationary && isInputNeutral && !colliding) {
                        const target = this.currentLevel.target;
                        const targetPoly = createPolygon(target.x, target.y, target.width, target.height, target.angle);

                        if (this.isCarInside(carPoly, targetPoly)) {
                            this.won = true;
                        }
                    }
                }
            }

            isCarInside(carPoly, targetPoly) {
                for (const p of carPoly) {
                    if (!SAT.isPointInConvexPoly(p, targetPoly)) return false;
                }
                return true;
            }

            /**
             * Returns the polygon representing the car's bounding box.
             * Used for SAT.
             * @returns {Vector2[]} Array of vertices
             */
            getPolygon() {
                const cos = Math.cos(this.heading);
                const sin = Math.sin(this.heading);

                // Calculate the center of the car body relative to the Rear Axle position (this.pos)
                // Back of car is at -rearOverhang, Front of car is at wheelBase + frontOverhang
                const bodyCenterDist = (this.wheelBase + this.frontOverhang - this.rearOverhang) / 2;

                const centerX = this.pos.x + bodyCenterDist * cos;
                const centerY = this.pos.y + bodyCenterDist * sin;
                const center = new Vector2(centerX, centerY);

                const hw = this.width / 2;
                const hl = this.length / 2;

                // Relative corners to the CENTER
                const corners = [
                    new Vector2(hl, hw),
                    new Vector2(hl, -hw),
                    new Vector2(-hl, -hw),
                    new Vector2(-hl, hw)
                ];

                // Rotate and translate (using the calculated center)
                return corners.map(p => p.rotate(this.heading).add(center));
            }
        }

        /**
         * SAT Collision Helper
         */
        const SAT = {
            /**
             * Checks if two convex polygons intersect.
             * @param {Vector2[]} polyA
             * @param {Vector2[]} polyB
             * @returns {boolean}
             */
            checkCollision(polyA, polyB) {
                const polygons = [polyA, polyB];
                for (let i = 0; i < polygons.length; i++) {
                    const polygon = polygons[i];
                    for (let j = 0; j < polygon.length; j++) {
                        const p1 = polygon[j];
                        const p2 = polygon[(j + 1) % polygon.length];

                        // Normal axis
                        const normal = new Vector2(-(p2.y - p1.y), p2.x - p1.x).normalize();

                        const minMaxA = this.project(polyA, normal);
                        const minMaxB = this.project(polyB, normal);

                        if (minMaxA.max < minMaxB.min || minMaxB.max < minMaxA.min) {
                            return false; // Gap found
                        }
                    }
                }
                return true;
            },

            project(poly, axis) {
                let min = poly[0].dot(axis);
                let max = min;
                for (let i = 1; i < poly.length; i++) {
                    const p = poly[i].dot(axis);
                    if (p < min) min = p;
                    if (p > max) max = p;
                }
                return { min, max };
            },

            isPointInConvexPoly(p, poly) {
                // Cross product approach
                // (p2.x - p1.x) * (p.y - p1.y) - (p2.y - p1.y) * (p.x - p1.x)
                let lastSign = 0;
                for (let i = 0; i < poly.length; i++) {
                    const p1 = poly[i];
                    const p2 = poly[(i + 1) % poly.length];

                    const val = (p2.x - p1.x) * (p.y - p1.y) - (p2.y - p1.y) * (p.x - p1.x);
                    if (val !== 0) {
                        const sign = val > 0 ? 1 : -1;
                        if (lastSign !== 0 && sign !== lastSign) return false;
                        lastSign = sign;
                    }
                }
                return true;
            }
        };

        /**
         * Renders the game state to a canvas.
         */
        class CanvasRenderer {
            /**
             * @param {HTMLCanvasElement} canvas
             */
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            /**
             * Draws the current frame.
             * @param {GameEngine} game
             */
            // TODO: Rename 'game' argument to 'engine' in a future refactor to avoid shadowing global variable.
            render(game) {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw Level Elements
                if (game.currentLevel) {
                    // Draw Target
                    const target = game.currentLevel.target;
                    this.drawRotatedRect(target.x, target.y, target.width, target.height, target.angle, 'rgba(46, 204, 113, 0.2)', '#2ecc71', [10, 5]);

                    // Draw Obstacles
                    for (const obs of game.currentLevel.obstacles) {
                        this.drawRotatedRect(obs.x, obs.y, obs.width, obs.height, obs.angle, '#7f8c8d');
                    }

                    // Draw Start Position (Ghost Car)
                    if (game.currentLevel.start) {
                        const start = game.currentLevel.start;

                        // Car dims from game config
                        const ghostLength = game.length;
                        const ghostWidth = game.width;
                        const ghostWB = game.wheelBase;

                        // Center of car relative to rear axle (start position)
                        const centerDist = ghostWB / 2;
                        const centerX = start.x + centerDist * Math.cos(start.heading || 0);
                        const centerY = start.y + centerDist * Math.sin(start.heading || 0);

                        this.drawRotatedRect(centerX, centerY, ghostLength, ghostWidth, start.heading || 0, 'rgba(255, 255, 255, 0.1)', 'rgba(255, 255, 255, 0.4)', [5, 5]);
                    }
                }

                this.ctx.save();

                // Translate to REAR AXLE (which is this.pos)
                this.ctx.translate(game.pos.x, game.pos.y);
                this.ctx.rotate(game.heading);

                // Now we are in local coordinates where (0,0) is the rear axle.
                // Car center should be at (wheelBase / 2, 0)
                const centerX = game.wheelBase / 2;
                const centerY = 0;

                // Draw Body
                // Rectangle needs to be centered at (centerX, centerY)
                this.ctx.fillStyle = '#3498db';
                if (game.crashTimer > 0) this.ctx.fillStyle = '#e74c3c'; // Red flash on crash
                if (game.won) this.ctx.fillStyle = '#2ecc71'; // Green if won

                // fillRect(x, y, w, h)
                // Top-left corner of the body relative to the local origin (rear axle):
                // x = centerX - length/2
                // y = centerY - width/2
                this.ctx.fillRect(centerX - game.length / 2, centerY - game.width / 2, game.length, game.width);

                // Indicate front with a small line or color difference
                this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
                // Front section
                this.ctx.fillRect(centerX + game.length / 4, centerY - game.width / 2, game.length / 4, game.width);

                // Draw Wheels
                this.ctx.fillStyle = '#000';
                const wheelWidth = 12;
                const wheelHeight = 6;

                const axleY = game.width / 2;

                // Rear Wheels (At local x=0)
                this.drawWheel(0, -axleY, wheelWidth, wheelHeight, 0);
                this.drawWheel(0, axleY, wheelWidth, wheelHeight, 0);

                // Front Wheels (At local x=wheelBase)
                this.drawWheel(game.wheelBase, -axleY, wheelWidth, wheelHeight, game.steerAngle);
                this.drawWheel(game.wheelBase, axleY, wheelWidth, wheelHeight, game.steerAngle);

                this.ctx.restore();
            }

            /**
             * Helper to draw a rotated rectangle.
             */
            drawRotatedRect(x, y, w, h, angle, fillStyle, strokeStyle = null, lineDash = []) {
                this.ctx.save();
                this.ctx.translate(x, y);
                this.ctx.rotate(angle);

                if (fillStyle) {
                    this.ctx.fillStyle = fillStyle;
                    this.ctx.fillRect(-w / 2, -h / 2, w, h);
                }

                if (strokeStyle) {
                    this.ctx.strokeStyle = strokeStyle;
                    this.ctx.lineWidth = fillStyle ? 4 : 2; // Default logic or param? Keeping simple
                    if (strokeStyle === 'rgba(255, 255, 255, 0.4)') this.ctx.lineWidth = 2; // Ghost car specific hack or make generic?
                    // Let's make it slightly more generic but simple for now
                    this.ctx.setLineDash(lineDash);
                    this.ctx.strokeRect(-w / 2, -h / 2, w, h);
                }

                this.ctx.restore();
            }

            drawWheel(x, y, w, h, angle) {
                this.ctx.save();
                this.ctx.translate(x, y);
                this.ctx.rotate(angle);
                this.ctx.fillRect(-w / 2, -h / 2, w, h);
                this.ctx.restore();
            }
        }

        // --- Bootstrap ---

        // Init
        const canvas = document.getElementById('gameCanvas');
        const engine = new GameEngine();
        const inputHandler = new InputHandler();
        const renderer = new CanvasRenderer(canvas);
        const telemetry = document.getElementById('telemetry');

        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const levelChooser = document.getElementById('level-chooser');
        const levelList = document.getElementById('level-list');
        const messageArea = document.getElementById('message-area');
        const returnContainer = document.getElementById('return-container');
        const returnBtn = document.getElementById('return-btn');

        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER

        // Level Manager Logic
        function initLevelChooser() {
            levelList.innerHTML = '';
            LEVELS.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerText = level.name;
                btn.onclick = () => startLevel(index);
                levelList.appendChild(btn);
            });
        }

        function startLevel(index) {
            const level = LEVELS[index];
            engine.loadLevel(level);
            gameState = 'PLAYING';

            // UI Updates
            levelChooser.style.display = 'none';
            messageArea.style.display = 'none';
            returnContainer.style.display = 'none';
        }

        function showMenu() {
            gameState = 'MENU';
            levelChooser.style.display = 'block';
            messageArea.style.display = 'none';
            returnContainer.style.display = 'none';
        }

        function showGameOver(won) {
            gameState = 'GAMEOVER';
            messageArea.style.display = 'block';
            messageArea.innerText = won ? 'LEVEL COMPLETE!' : 'CRASHED!';
            messageArea.className = won ? 'win' : 'loss';
            returnContainer.style.display = 'block';
        }

        returnBtn.onclick = () => {
            showMenu();
        };

        // --- Editor Logic ---
        let selectedObject = null; // { type: 'obstacle'|'target'|'start', index?: number, obj: object }
        const editorUi = document.getElementById('editor-ui');
        const inpX = document.getElementById('edit-x');
        const inpY = document.getElementById('edit-y');
        const inpW = document.getElementById('edit-w');
        const inpH = document.getElementById('edit-h');
        const inpAngle = document.getElementById('edit-angle');
        const btnApply = document.getElementById('btn-apply');
        const btnClose = document.getElementById('btn-close');
        const btnCopy = document.getElementById('btn-copy-level');

        function showEditor(obj, type) {
            selectedObject = { obj, type };
            inpX.value = obj.x;
            inpY.value = obj.y;
            // Handle different object types
            if (type === 'start') {
                // Start has no width/height in data, but represented by car dims
                inpW.value = engine.width; // Read-only ideally or just reference
                inpH.value = engine.length;
                inpW.disabled = true;
                inpH.disabled = true;
                inpAngle.value = obj.heading || 0;
            } else {
                inpW.value = obj.width;
                inpH.value = obj.height;
                inpW.disabled = false;
                inpH.disabled = false;
                inpAngle.value = obj.angle || 0;
            }
            editorUi.style.display = 'flex';
        }

        function hideEditor() {
            editorUi.style.display = 'none';
            selectedObject = null;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'PLAYING') return;

            // Allow normal interaction if editor is open? No, let's close it if clicking elsewhere
            // But if we click ON the editor, this event won't trigger because editor is on top.

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const mouseVec = new Vector2(mouseX, mouseY);

            // Hit Test Priority: Start > Target > Obstacles
            // 1. Check Start (Ghost)
            if (engine.currentLevel.start) {
                const start = engine.currentLevel.start;
                // Car polygon at start
                const ghostWB = engine.wheelBase;
                const centerDist = ghostWB / 2;
                const centerX = start.x + centerDist * Math.cos(start.heading || 0);
                const centerY = start.y + centerDist * Math.sin(start.heading || 0);
                const startPoly = createPolygon(centerX, centerY, engine.length, engine.width, start.heading || 0);

                if (SAT.isPointInConvexPoly(mouseVec, startPoly)) {
                    showEditor(start, 'start');
                    return;
                }
            }

            // 2. Check Target
            if (engine.currentLevel.target) {
                const t = engine.currentLevel.target;
                const tPoly = createPolygon(t.x, t.y, t.width, t.height, t.angle);
                if (SAT.isPointInConvexPoly(mouseVec, tPoly)) {
                    showEditor(t, 'target');
                    return;
                }
            }

            // 3. Check Obstacles
            if (engine.currentLevel.obstacles) {
                for (const obs of engine.currentLevel.obstacles) {
                    const obsPoly = createPolygon(obs.x, obs.y, obs.width, obs.height, obs.angle);
                    if (SAT.isPointInConvexPoly(mouseVec, obsPoly)) {
                        showEditor(obs, 'obstacle');
                        return;
                    }
                }
            }

            // Clicked nothing? Close editor
            hideEditor();
        });

        btnApply.onclick = () => {
            if (!selectedObject) return;
            const obj = selectedObject.obj;

            obj.x = parseFloat(inpX.value);
            obj.y = parseFloat(inpY.value);

            if (selectedObject.type === 'start') {
                obj.heading = parseFloat(inpAngle.value);
                // W/H ignored for start
            } else {
                obj.width = parseFloat(inpW.value);
                obj.height = parseFloat(inpH.value);
                obj.angle = parseFloat(inpAngle.value);
            }
            // Flash success?
            btnApply.innerText = "Applied!";
            setTimeout(() => btnApply.innerText = "Apply", 1000);
        };

        btnClose.onclick = hideEditor;

        btnCopy.onclick = () => {
            if (!engine.currentLevel) return;
            const json = JSON.stringify(engine.currentLevel, null, 4);
            navigator.clipboard.writeText(json).then(() => {
                btnCopy.innerText = "Copied!";
                setTimeout(() => btnCopy.innerText = "📋 Copy Level JSON", 2000);
            }).catch(err => {
                console.error('Failed to copy', err);
                alert("Failed to copy to clipboard. Check console.");
            });
        };

        // Show Copy button when playing
        const originalStartLevel = startLevel;
        startLevel = function (index) {
            originalStartLevel(index);
            btnCopy.style.display = 'block';
        };

        const originalShowMenu = showMenu;
        showMenu = function () {
            originalShowMenu();
            btnCopy.style.display = 'none';
            hideEditor();
        };

        // Bootstrap
        initLevelChooser();
        showMenu();

        // Expose to window
        window.game = engine;

        // Game Loop
        let lastTime = performance.now();

        function loop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (gameState === 'PLAYING') {
                // Get Inputs
                const input = {
                    steer: inputHandler.getSteer(),
                    throttle: inputHandler.getThrottle()
                };

                // Update Logic
                engine.update(dt, input);

                // Telemetry
                const vKmh = (engine.velocity / 20 * 3.6).toFixed(1);
                const scoreText = `Score: ${engine.score}`;
                telemetry.innerText = `Pos: (${engine.pos.x.toFixed(0)}, ${engine.pos.y.toFixed(0)})\nHeading: ${(engine.heading * 180 / Math.PI).toFixed(1)}°\nSpeed: ${vKmh} km/h\nSteer: ${(engine.steerAngle * 180 / Math.PI).toFixed(1)}°\n${scoreText}`;

                // Check for Game Over conditions
                if (engine.won) {
                    showGameOver(true);
                }
            }

            // Render
            renderer.render(engine);

            // Telemetry Update
            if (gameState === 'PLAYING') {
                telemetry.innerText = `Level: ${engine.currentLevel ? engine.currentLevel.name : 'None'}
Pos: (${engine.pos.x.toFixed(1)}, ${engine.pos.y.toFixed(1)})
Heading: ${(engine.heading * 180 / Math.PI).toFixed(1)}°
Speed: ${engine.velocity.toFixed(1)} px/s
Steer: ${(engine.steerAngle * 180 / Math.PI).toFixed(1)}°`;
            } else {
                telemetry.innerText = `State: ${gameState}`;
            }

            requestAnimationFrame(loop);
        }

        // Start Loop
        requestAnimationFrame(loop);


        // --- Self-Test ---
        (function runSelfTest() {
            console.log("Running Self-Test: 1s of Gas + Left Turn...");
            const testEngine = new GameEngine();
            // Move starting position to 0,0 for easier calculation checks if needed, or keep default
            testEngine.pos = new Vector2(0, 0);
            testEngine.heading = 0;
            testEngine.velocity = 0;

            const dt = 1 / 60; // Fixed timestep for test
            const steps = 60; // 1 second roughly

            for (let i = 0; i < steps; i++) {
                testEngine.update(dt, { steer: -1, throttle: 1 });
            }

            console.log("Self-Test Complete.");
            console.log(`Final Position: x=${testEngine.pos.x.toFixed(2)}, y=${testEngine.pos.y.toFixed(2)}`);
            console.log(`Final Heading: ${(testEngine.heading * 180 / Math.PI).toFixed(2)} degrees`);

            // Simple heuristic check: Should have moved forward and turned left (negative y, positive x, negative heading)
            if (testEngine.pos.x > 0 && testEngine.pos.y < 0 && testEngine.heading < 0) {
                console.log("Self-Test PASSED: Movement logic appears correct (moved forward-left).");
            } else {
                console.warn("Self-Test WARNING: Unexpected position/heading.");
            }
        })();

        /**
         * Runs a regression test to verify turning circle dimensions.
         * @param {typeof GameEngine} EngineClass The GameEngine class to test
         * @returns {object} Test results
         */
        function testTurningCircle(EngineClass) {
            const engine = new EngineClass();
            console.log("Starting Turning Circle Test...");
            console.log(`Config: WheelBase=${engine.wheelBase}, MaxSteer=${engine.maxSteerAngle.toFixed(3)} rad`);

            engine.steerAngle = engine.maxSteerAngle;
            engine.velocity = 100; // Constant speed
            const dt = 0.01;
            const startPos = { x: engine.pos.x, y: engine.pos.y };
            let maxDist = 0;

            // Calculate expected period
            // angular_velocity = (v / L) * tan(delta)
            const w = (engine.velocity / engine.wheelBase) * Math.tan(engine.steerAngle);
            const T = 2 * Math.PI / w;

            // Simulate for slightly more than half a period to find diameter
            const duration = (T / 2) * 1.2;
            const steps = Math.ceil(duration / dt);

            for (let i = 0; i < steps; i++) {
                // Manually integrate position for constant circular motion verification
                // (Using same logic as engine.update mainly, but ensuring constant velocity/steer)

                // Update Pos
                engine.pos.x += engine.velocity * Math.cos(engine.heading) * dt;
                engine.pos.y += engine.velocity * Math.sin(engine.heading) * dt;

                // Update Heading
                const angularVelocity = (engine.velocity / engine.wheelBase) * Math.tan(engine.steerAngle);
                engine.heading += angularVelocity * dt;

                // Track max distance from start (Diameter)
                const dist = Math.sqrt(Math.pow(engine.pos.x - startPos.x, 2) + Math.pow(engine.pos.y - startPos.y, 2));
                if (dist > maxDist) maxDist = dist;
            }

            const diameter = maxDist;
            const radius = diameter / 2;

            console.log(`Turning Circle Test Results: Diameter=${diameter.toFixed(2)}, Radius=${radius.toFixed(2)}`);
            return { diameter, radius };
        }

        window.runRegressionTests = () => testTurningCircle(GameEngine);

    </script>
