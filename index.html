<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Kinematic Parking Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            color: #eee;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #telemetry {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            white-space: pre-wrap;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            z-index: 10;
        }

        /* New UI Styles */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #level-chooser {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #444;
        }

        #level-chooser h1 {
            margin-top: 0;
        }

        .level-btn {
            display: block;
            width: 200px;
            padding: 10px;
            margin: 10px auto;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            border-radius: 5px;
        }

        .level-btn:hover {
            background: #2980b9;
        }

        #message-area {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }

        .win {
            color: #2ecc71;
        }

        .loss {
            color: #e74c3c;
        }

        #return-btn {
            margin-top: 20px;
            background: #7f8c8d;
            pointer-events: auto;
        }

        #return-container {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            display: none;
        }

        /* Editor UI */
        #editor-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 2px solid #555;
            border-radius: 8px;
            display: none;
            pointer-events: auto;
            flex-direction: column;
            gap: 10px;
            color: #fff;
        }

        #editor-ui h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            text-align: center;
        }

        .editor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-row label {
            width: 60px;
        }

        .editor-row input {
            width: 140px;
            padding: 4px;
            background: #333;
            color: #fff;
            border: 1px solid #666;
        }

        .editor-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .editor-btn {
            flex: 1;
            padding: 8px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }

        #btn-apply {
            background: #27ae60;
        }

        #btn-close {
            background: #c0392b;
        }

        #btn-copy-level {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: #f39c12;
            color: #fff;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 30;
            display: none;
            /* Only show when playing */
        }
    </style>
</head>

<body>
    <div id="telemetry">Loading...</div>
    <div id="ui-layer">
        <div id="message-area"></div>
        <div id="level-chooser">
            <h1>Select Level</h1>
            <div style="margin-bottom: 20px;">
                <label for="car-select"
                    style="display: block; margin-bottom: 10px; font-weight: bold; color: #3498db;">Select Your
                    Car</label>
                <select id="car-select"
                    style="padding: 10px; border-radius: 5px; width: 250px; background: #333; color: white; border: 1px solid #555;">
                </select>
            </div>
            <div id="level-list"></div>
        </div>
        <div id="return-container">
            <button id="return-btn" class="level-btn">Back to Menu</button>
        </div>

        <!-- Editor UI -->
        <button id="btn-copy-level">📋 Copy Level JSON</button>
        <div id="editor-ui">
            <h3>Edit Entity</h3>
            <div class="editor-row"><label>X:</label><input type="number" id="edit-x" step="1"></div>
            <div class="editor-row"><label>Y:</label><input type="number" id="edit-y" step="1"></div>
            <div class="editor-row"><label>W:</label><input type="number" id="edit-w" step="1"></div>
            <div class="editor-row"><label>H:</label><input type="number" id="edit-h" step="1"></div>
            <div class="editor-row"><label>Angle:</label><input type="number" id="edit-angle" step="0.1"></div>
            <div class="editor-actions">
                <button id="btn-apply" class="editor-btn">Apply</button>
                <button id="btn-close" class="editor-btn">Close</button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script type="module" src="src/main.js"></script>
</body>

</html>
