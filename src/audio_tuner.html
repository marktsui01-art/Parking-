<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Sound Tuner - Component Refactor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; margin: 0; height: 100vh; overflow: hidden; }
        header { padding: 15px; background: #252525; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: #4f8; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .controls { width: 420px; overflow-y: auto; padding: 15px; border-right: 2px solid #333; background: #222; scrollbar-width: thin; }
        .visualizer-area { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #000; position: relative; }
        canvas { width: 100%; height: 250px; background: #050505; border: 1px solid #333; border-radius: 8px; }

        .panel { margin-bottom: 20px; border: 1px solid #333; padding: 12px; border-radius: 8px; background: #2a2a2a; }
        .panel h3 { margin: -12px -12px 10px -12px; font-size: 0.75rem; color: #888; text-transform: uppercase; background: #333; padding: 6px 12px; border-radius: 8px 8px 0 0; }

        .control-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
        .control-row label { flex: 1; color: #ccc; }
        .control-row input[type="range"] { flex: 2; height: 4px; accent-color: #4f8; }
        .control-row input[type="number"] { width: 70px; background: #111; border: 1px solid #444; color: #4f8; padding: 2px 5px; border-radius: 4px; }
        .control-row span { width: 45px; text-align: right; font-family: monospace; color: #4f8; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { background: #333; color: #eee; border: 1px solid #444; cursor: pointer; padding: 8px; font-size: 0.8rem; border-radius: 4px; transition: all 0.2s; }
        button:hover { background: #444; border-color: #555; }
        button.active { background: #1a1; color: white; border-color: #2c2; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        button.scenario { background: #345; border-color: #456; }
        button.scenario:active { transform: scale(0.95); }

        .simulation-hero { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .hero-stats { display: flex; justify-content: space-around; font-family: 'Courier New', Courier, monospace; color: #4f8; font-size: 1.4rem; font-weight: bold; }
        .hero-stats div { text-align: center; }
        .hero-stats span { display: block; font-size: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 4px; }

        .harmonic-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .harmonic-row input { background: #111; border: 1px solid #444; color: #ddd; padding: 4px; width: 100%; border-radius: 4px; }
        .btn-del { width: 30px; color: #f44; border-color: #633; }

        textarea { width: 100%; height: 200px; background: #050505; color: #0f0; border: 1px solid #333; font-family: 'Consolas', monospace; font-size: 0.75rem; padding: 10px; border-radius: 8px; margin-top: 10px; }

        .vtec-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #333; margin-left: 10px; border: 1px solid #444; transition: 0.1s; }
        .vtec-indicator.on { background: #f00; box-shadow: 0 0 15px #f00; border-color: #f66; }
    </style>
</head>
<body>

<header>
    <h1>PHYSICAL ENGINE TUNER v2.0 <div id="vtec-light" class="vtec-indicator"></div></h1>
    <div>
        <button id="btn-export">Export Config</button>
        <button id="btn-import">Load JSON</button>
    </div>
</header>

<div class="main-container">
    <div class="controls">

        <!-- SIMULATION CONTROL -->
        <div class="panel">
            <h3>Simulation & Scenarios</h3>
            <button id="btn-ignition" style="width:100%; font-weight:bold; margin-bottom:12px;">START ENGINE</button>
            <div class="simulation-hero">
                <div class="hero-stats">
                    <div><span>RPM</span><span id="rpm-display">0</span></div>
                    <div><span>Speed</span><span id="speed-display">0.0</span></div>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="scenario" id="btn-scen-rev">GENEROUS REV</button>
                <button class="scenario" id="btn-scen-brake">ENGINE BRAKING</button>
            </div>

            <div class="control-row">
                <label>Throttle</label>
                <input type="range" id="throttle-slider" min="0" max="1" step="0.01" value="0">
                <span id="throttle-val">0%</span>
            </div>
        </div>

        <!-- ENGINE PRESET -->
        <div class="panel">
            <h3>Engine Architecture</h3>
            <select id="preset-select" style="width:100%; padding:10px; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
                <option value="i4">Standard Inline 4</option>
                <option value="civic_vtec">Honda B16 (VTEC)</option>
                <option value="i6">BMW Straight 6</option>
                <option value="v8">Muscle V8</option>
                <option value="flat6">Porsche Flat 6 (VarioCam)</option>
                <option value="ev">Electric Drive</option>
            </select>
        </div>

        <!-- MECHANICAL LAYER -->
        <div class="panel">
            <h3>1. Mechanical (Internal)</h3>
            <div class="control-row">
                <label>Friction Gain</label>
                <input type="range" class="param-slider" data-path="params.mechanical.frictionGain" min="0" max="1" step="0.01">
            </div>
            <div class="control-row">
                <label>Valve Gain</label>
                <input type="range" class="param-slider" data-path="params.mechanical.valveGain" min="0" max="1" step="0.01">
            </div>
            <div class="control-row">
                <label>Block Filter</label>
                <input type="range" class="param-slider" data-path="params.mechanical.filterBase" min="200" max="5000" step="10">
            </div>
        </div>

        <!-- INTAKE LAYER -->
        <div class="panel">
            <h3>2. Intake (Induction)</h3>
            <div class="control-row">
                <label>Primary Gain</label>
                <input type="range" class="param-slider" data-path="params.intake.gain" min="0" max="2" step="0.05">
            </div>
            <div class="control-row">
                <label>VTEC Scream</label>
                <input type="range" class="param-slider" data-path="params.intake.screamGain" min="0" max="1" step="0.05">
            </div>
            <div class="control-row">
                <label>Induction Freq</label>
                <input type="range" class="param-slider" data-path="params.intake.filterBase" min="100" max="2000" step="10">
            </div>
        </div>

        <!-- EXHAUST LAYER -->
        <div class="panel">
            <h3>3. Exhaust (Combustion)</h3>
            <div class="control-row">
                <label>Exhaust Volume</label>
                <input type="range" class="param-slider" data-path="params.exhaust.gain" min="0" max="2" step="0.05">
            </div>
            <div class="control-row">
                <label>Pipe Resonance</label>
                <input type="range" class="param-slider" data-path="params.exhaust.resonance" min="0" max="1" step="0.01">
            </div>
            <div class="control-row">
                <label>Distortion (Muscle)</label>
                <input type="range" class="param-slider" data-path="params.exhaust.distortion" min="0" max="100" step="1">
            </div>
        </div>

        <!-- VTEC/REDFILL PARAMS -->
        <div class="panel">
            <h3>Variable Timing & Redline</h3>
            <div class="control-row">
                <label>Redline (RPM)</label>
                <input type="number" class="param-slider" data-path="params.redline" min="1000" max="18000">
            </div>
            <div class="control-row">
                <label>VTEC Threshold</label>
                <input type="number" class="param-slider" data-path="params.vtec.rpm" min="0" max="10000">
            </div>
            <div class="control-row">
                <label>Freq Shift %</label>
                <input type="range" class="param-slider" data-path="params.vtec.freqShift" min="1.0" max="1.5" step="0.01">
            </div>
        </div>

        <!-- HARMONICS LIST -->
        <div class="panel">
            <h3>Harmonic Signature</h3>
            <div id="harmonics-list"></div>
            <button id="btn-add-harmonic" style="width:100%; margin-top:5px;">+ Add Harmonic Layer</button>
        </div>

    </div>

    <div class="visualizer-area">
        <canvas id="viz-canvas" width="800" height="250"></canvas>
        <div style="flex:1; display:flex; flex-direction:column;">
            <label style="color:#888; font-size:0.7rem;">TUNER SCHEMA (JSON)</label>
            <textarea id="json-io"></textarea>
        </div>
    </div>
</div>

<script type="module" src="./AudioTuner.js"></script>
</body>
</html>
