<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Sound Tuner</title>
    <style>
        body { font-family: monospace; background: #222; color: #eee; display: flex; flex-direction: column; margin: 0; height: 100vh; overflow: hidden; }
        header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        h1 { margin: 0; font-size: 1.2rem; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .controls { width: 400px; overflow-y: auto; padding: 10px; border-right: 1px solid #444; background: #2a2a2a; }
        .visualizer-area { flex: 1; display: flex; flex-direction: column; padding: 10px; background: #000; }
        canvas { width: 100%; height: 300px; background: #111; border: 1px solid #333; }

        .panel { margin-bottom: 15px; border: 1px solid #444; padding: 10px; border-radius: 4px; background: #333; }
        .panel h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #555; padding-bottom: 5px; }

        .control-row { display: flex; align-items: center; margin-bottom: 5px; font-size: 0.8rem; }
        .control-row label { flex: 1; }
        .control-row input[type="range"] { flex: 2; }
        .control-row input[type="number"] { width: 60px; background: #444; border: 1px solid #555; color: white; }
        .control-row span { width: 40px; text-align: right; margin-left: 5px; }

        .harmonic-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .harmonic-row input { width: 100%; }

        button { background: #444; color: #fff; border: 1px solid #666; cursor: pointer; padding: 5px 10px; font-family: inherit; }
        button:hover { background: #555; }
        button.active { background: #4a6; border-color: #6c8; }

        .simulation-info { font-size: 1.5rem; color: #4f8; text-align: center; margin: 10px 0; }

        /* Specific Styles */
        #json-output { width: 100%; height: 100px; background: #111; color: #0f0; border: 1px solid #444; font-size: 0.7rem; }
    </style>
</head>
<body>

<header>
    <h1>Engine Audio Tuner</h1>
    <div>
        <button id="btn-export">Copy JSON</button>
        <button id="btn-import">Load JSON</button>
    </div>
</header>

<div class="main-container">
    <div class="controls">

        <!-- Simulation Control -->
        <div class="panel">
            <h3>Simulation</h3>
            <button id="btn-ignition" style="width:100%">START ENGINE</button>
            <div class="simulation-info">
                <div id="rpm-display">RPM: 0</div>
                <div id="speed-display">0 km/h</div>
            </div>
            <div class="control-row">
                <label>Throttle</label>
                <input type="range" id="throttle-slider" min="0" max="1" step="0.01" value="0">
                <span id="throttle-val">0%</span>
            </div>
             <div class="control-row">
                <label>Auto-Rev</label>
                <input type="checkbox" id="chk-autorev">
            </div>
        </div>

        <!-- Preset Loader -->
        <div class="panel">
            <h3>Engine Preset</h3>
            <select id="preset-select" style="width:100%; padding:5px; background:#444; color:#fff; border:1px solid #555;">
                <option value="i4">Inline 4</option>
                <option value="i6">Inline 6</option>
                <option value="v8">V8</option>
                <option value="flat6">Flat 6</option>
                <option value="ev">Electric</option>
            </select>
        </div>

        <!-- Mixer -->
        <div class="panel">
            <h3>Mixer</h3>
            <div class="control-row">
                <label>Mechanical</label>
                <input type="range" class="layer-gain" data-layer="mechanical" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="control-row">
                <label>Exhaust (Wet)</label>
                <input type="range" class="layer-gain" data-layer="exhaust" min="0" max="1" step="0.05" value="1">
            </div>
             <div class="control-row">
                <label>Sub-Bass</label>
                <input type="range" class="layer-gain" data-layer="sub" min="0" max="1" step="0.05" value="1">
            </div>
             <div class="control-row">
                <label>Noise/Rumble</label>
                <input type="range" class="layer-gain" data-layer="noise" min="0" max="1" step="0.05" value="1">
            </div>
        </div>

        <!-- Base Parameters -->
        <div class="panel" id="params-container">
            <h3>Core Parameters</h3>
            <div class="control-row">
                <label>Base Freq (Hz)</label>
                <input type="number" id="inp-basefreq" value="20">
            </div>
            <div class="control-row">
                <label>Oscillator</label>
                <select id="inp-osctype" style="background:#444; color:white; border:none;">
                    <option value="sawtooth">Sawtooth</option>
                    <option value="sine">Sine</option>
                    <option value="triangle">Triangle</option>
                    <option value="square">Square</option>
                </select>
            </div>
            <div class="control-row">
                <label>Distortion</label>
                <input type="range" id="inp-distortion" min="0" max="100" value="15">
            </div>
        </div>

        <!-- Harmonics Editor -->
        <div class="panel">
            <h3>Harmonics</h3>
            <div id="harmonics-list">
                <!-- Injected via JS -->
            </div>
            <button id="btn-add-harmonic">+ Add Harmonic</button>
        </div>

        <!-- Filter Params (Simplified view) -->
        <div class="panel">
            <h3>Global Filter</h3>
            <div class="control-row">
                <label>Base Cutoff</label>
                <input type="range" class="param-slider" data-path="params.filter.base" min="100" max="1000" value="300">
            </div>
            <div class="control-row">
                <label>Speed Mod</label>
                <input type="range" class="param-slider" data-path="params.filter.speedCoef" min="0" max="2000" value="800">
            </div>
            <div class="control-row">
                <label>Throttle Mod</label>
                <input type="range" class="param-slider" data-path="params.filter.throttleCoef" min="0" max="3000" value="1500">
            </div>
             <div class="control-row">
                <label>Resonance (Q)</label>
                <input type="range" class="param-slider" data-path="params.filter.Q" min="0" max="20" step="0.1" value="2">
            </div>
        </div>

    </div>

    <div class="visualizer-area">
        <canvas id="viz-canvas" width="800" height="300"></canvas>
        <div style="margin-top:10px;">
            <label>JSON Config:</label>
            <textarea id="json-io" style="width:100%; height:150px; background:#111; color:#0f0; border:1px solid #444; font-family:monospace; font-size:0.7rem;"></textarea>
        </div>
    </div>
</div>

<script type="module" src="./AudioTuner.js"></script>
</body>
</html>
